labeling:
  train_video_folder_path: "train_videos"
  train_dataset_path: "train_dataset"
  conf_threshold: 0.25
  extraction_framerate: 5
  eval_video_folder_path: "eval_videos"
  eval_dataset_path: "eval_dataset"
  max_sizes:
    train_A: [22, 10]
    train_B: [12, 13]
    train_C: [142, 159]
    train_D: [50, 25]
    eval_A: [60, 110]
  min_sizes:
    eval_A: [19, 20]

training:
  train_dataset_path: "train_dataset"
  model_save_path: "trained_models"
  yolo_model_config: "yolo26s.yaml"


evaluation:
  eval_dataset_path: "eval_dataset"
  eval_video_folder_path: "eval_videos"
  model_path: "trained_models/20260512_222222.pt" 
  output_report_path: "eval_dataset/evaluation_metrics.md"
  conf_threshold: 0.2
  iou_threshold: 0.5
  image_frequency_fps: 1.0
  reference_object_length_m: 4.5
  horizontal_fov_degrees: 90.0
  distance_bands_m:
    - [0, 200]
    - [200, 400]
